[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stratiq"
version = "0.1.0"
description = "StratIQ: research and educational LLM-assisted backtester for gold"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "yfinance",
    "pydantic>=2",
    "plotly",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "hypothesis",
    "ruff",
    "pre-commit",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stratiq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow and not ollama'"
markers = [
    "slow: long-running tests, run manually",
    "ollama: tests that need a running Ollama server, run manually",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["stratiq"]